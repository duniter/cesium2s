<form [formGroup]="form">
  <swiper-container #swiper [config]="swiperOptions" [modules]="swiperModules" [class]="classList">
    <!-- Choose code -->
    <swiper-slide class="ion-padding" cdkTrapFocus>
      <ion-text>TODO create passcode</ion-text>

      <code-input [isCodeHidden]="true" [codeLength]="5" (codeChanged)="onCodeChanged($event)" (codeCompleted)="onCodeCompleted($event)"></code-input>
    </swiper-slide>

    <!-- Confirm -->
    <swiper-slide class="ion-padding" cdkTrapFocus>
      <ion-text>TODO confirm</ion-text>

      <code-input [isCodeHidden]="true" [codeLength]="5" (codeChanged)="onCodeChanged($event)" (codeCompleted)="onCodeCompleted($event)"></code-input>
    </swiper-slide>
  </swiper-container>
</form>
